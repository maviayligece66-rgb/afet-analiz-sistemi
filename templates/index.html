/* ==========================================================================
   RiskAtlas ana sayfa stilleri (index.css)
   1) Ana sayfanın tüm temel stilleri   2) Yeni bileşenler (CTA butonları, Hesap paneli)
   Not: --risk-rengi değişkeni app.py içindeki küçük <style> bloğundan gelir.
   ========================================================================== */

/* ---------- 1) Temel stiller ---------- */
:root {
    --bg1:#06111f;
    --bg2:#0b1e35;
    --card:rgba(12, 29, 52, 0.88);
    --card2:rgba(17, 41, 72, 0.88);
    --text:#eaf4ff;
    --muted:#a8c5df;
    --blue:#2f89ff;
    --blue2:#00c2ff;
    --danger:#ff3b3b;
    --border:rgba(95, 177, 255, 0.25);
}

#splash-screen {
    display:none;
}

#splash-screen.fade-out {
    opacity:0;
    pointer-events:none;
}

.splash-image {
    width:100%;
    height:100%;
    object-fit:cover;
}

body {
    background:
        radial-gradient(circle at top left, rgba(0,194,255,0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47,137,255,0.20), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    color:var(--text);
    font-family:Arial, sans-serif;
    margin:0;
    padding:15px;
}

h1, h2 {
    text-align:center;
}

.box {
    background:var(--card);
    color:var(--text);
    padding:22px;
    border-radius:18px;
    margin:14px auto;
    max-width:1200px;
    box-shadow:0 18px 45px rgba(0,0,0,0.35);
    border:1px solid var(--border);
    backdrop-filter: blur(10px);
}

input,
select {
    padding:12px;
    margin:5px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b1b31;
    color:var(--text);
}

label {
    display:block;
    margin-top:10px;
    font-weight:bold;
    color:#dceeff;
}

small {
    display:block;
    color:var(--muted);
    margin:0 5px 8px 5px;
    line-height:1.4;
}

.zemin-info-box {
    margin-top:15px;
    padding:15px;
    background:rgba(0,194,255,0.10);
    color:#dff6ff;
    border-left:6px solid var(--blue2);
    border-radius:12px;
    line-height:1.5;
}

button {
    padding:12px 16px;
    background:linear-gradient(135deg, var(--blue), var(--blue2));
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0, 194, 255, 0.18);
}

button:hover {
    filter:brightness(1.08);
}

.risk-score-box {
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:var(--text);
    text-align:center;
    font-size:20px;
    font-weight:bold;
    border:3px solid var(--risk-rengi);
}

.earthquake-list {
    margin-top:15px;
    padding:15px;
    background:var(--card2);
    color:var(--text);
    border-radius:14px;
    line-height:1.6;
    border:1px solid var(--border);
}

.example-box {
    margin-top:15px;
    padding:15px;
    background:rgba(255,255,255,0.08);
    color:#dceeff;
    border-radius:12px;
    font-size:0.92em;
    line-height:1.6;
}

.suggestion-box {
    margin-top:20px;
    padding:18px;
    background:rgba(39,174,96,0.14);
    color:#d8ffe8;
    border-left:6px solid #27ae60;
    border-radius:12px;
    line-height:1.5;
}

.accessibility-note {
    margin-top:20px;
    padding:15px;
    background:rgba(0,194,255,0.10);
    color:#dff6ff;
    border-radius:12px;
    line-height:1.5;
}

.landing-screen {
    min-height:100vh;
    position:relative;
    overflow:hidden;
    border-radius:24px;
    margin:0 auto 20px auto;
    max-width:1250px;
    background:
        linear-gradient(180deg, rgba(3,10,22,0.18), rgba(3,10,22,0.78)),
        url('/static/riskatlas-bg.png');
    background-size:cover;
    background-position:center;
    border:1px solid var(--border);
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
    padding:28px;
    box-sizing:border-box;
}

.landing-topbar {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    position:relative;
    z-index:2;
}

.brand {
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon {
    width:54px;
    height:54px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #ef233c, #9d0208);
    box-shadow:0 10px 25px rgba(255,59,59,0.28);
    font-size:28px;
}

.brand-title {
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.5px;
}

.brand-title span {
    color:#ff3b3b;
}

.brand-subtitle {
    color:#d7eaff;
    font-size:14px;
    margin-top:2px;
}

.top-actions {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:flex-end;
}

.voice-toggle-btn {
    background:rgba(39,174,96,0.22) !important;
    border:1px solid rgba(39,174,96,0.55) !important;
}

.voice-toggle-btn.off {
    background:rgba(255,255,255,0.10) !important;
    border:1px solid rgba(255,255,255,0.22) !important;
    color:#cfd8e3;
}

.top-actions button {
    background:rgba(8,24,43,0.72);
    border:1px solid var(--border);
    box-shadow:none;
    padding:10px 14px;
}

.landing-center {
    min-height:62vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
}

.landing-panel {
    width:min(560px, 92%);
    padding:32px;
    background:rgba(7,17,33,0.86);
    border:1px solid var(--border);
    border-radius:24px;
    backdrop-filter:blur(14px);
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.42);
}

.landing-panel h1 {
    text-align:center;
    font-size:36px;
    margin:0 0 8px 0;
    letter-spacing:-0.5px;
}

.landing-panel h1 span {
    color:#ff3b3b;
}

.landing-panel h2 {
    text-align:center;
    margin:18px 0 8px 0;
    font-size:22px;
}

.landing-panel p {
    color:#d7eaff;
    font-size:16px;
    line-height:1.55;
    margin:8px 0;
}

.location-symbol {
    margin:22px auto 14px auto;
    width:92px;
    height:92px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle, rgba(47,137,255,0.28), rgba(0,194,255,0.06));
    border:1px solid rgba(95,177,255,0.35);
    font-size:54px;
    box-shadow:0 0 45px rgba(47,137,255,0.28);
}

.landing-actions {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:22px;
}

.landing-actions button {
    min-width:170px;
    font-size:16px;
}

.secondary-btn {
    background:rgba(255,255,255,0.10);
    border:1px solid var(--border);
}

.status-box {
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:#dff6ff;
    line-height:1.5;
}

.side-card {
    position:absolute;
    z-index:2;
    width:250px;
    padding:18px;
    border-radius:16px;
    background:rgba(7,17,33,0.72);
    border:1px solid var(--border);
    backdrop-filter:blur(10px);
    line-height:1.5;
    box-shadow:0 18px 45px rgba(0,0,0,0.28);
}

.side-card h3 {
    margin:0 0 8px 0;
}

.side-card p,
.side-card li {
    color:#d7eaff;
    font-size:14px;
}

.side-card.left {
    left:28px;
    bottom:145px;
    border-color:rgba(255,59,59,0.42);
}

.side-card.right {
    right:28px;
    bottom:145px;
    border-color:rgba(39,174,96,0.46);
}

.side-card ul {
    margin:8px 0 0 0;
    padding-left:22px;
}

.bottom-features {
    position:absolute;
    z-index:2;
    left:28px;
    right:28px;
    bottom:28px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    padding:14px;
    background:rgba(7,17,33,0.64);
    border:1px solid var(--border);
    border-radius:18px;
    backdrop-filter:blur(10px);
}

.feature-item {
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:10px;
    border-right:1px solid rgba(95,177,255,0.16);
}

.feature-item:last-child {
    border-right:none;
}

.feature-icon {
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(47,137,255,0.20);
    font-size:22px;
    flex-shrink:0;
}

.feature-item b {
    display:block;
    margin-bottom:4px;
}

.feature-item span {
    color:#c8dff2;
    font-size:14px;
    line-height:1.4;
}

.main-content {
    display:none;
}

.main-content.active {
    display:block;
}

.emergency-alert {
    display:none;
    position:fixed;
    z-index:99999;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:red;
    color:white;
    text-align:center;
    padding:30vh 20px 0 20px;
    box-sizing:border-box;
    animation:flash 0.7s infinite;
}

.emergency-alert h1 {
    font-size:44px;
    margin-bottom:15px;
}

.emergency-alert p {
    font-size:24px;
    font-weight:bold;
}

.close-alert {
    margin-top:20px;
    background:white;
    color:#b00000;
    font-size:18px;
}

@keyframes flash {
    0% { background-color:#ff0000; }
    50% { background-color:#6b0000; }
    100% { background-color:#ff0000; }
}

@media (max-width:700px) {
    #splash-screen {
        position:fixed;
        inset:0;
        background:#081120;
        display:flex;
        align-items:center;
        justify-content:center;
        z-index:999999;
        transition:opacity .8s ease;
    }

    body {
        padding:8px;
        background:
            linear-gradient(180deg, rgba(3,10,22,0.35), rgba(3,10,22,0.88)),
            url('/static/mobile-bg.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        background-attachment: scroll;
    }

    .landing-screen {
        background:
            linear-gradient(180deg, rgba(3,10,22,0.25), rgba(3,10,22,0.82)),
            url('/static/mobile-bg.png');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        border-radius: 22px;
        overflow: hidden;
    }

    .box {
        padding:12px;
    }

    input,
    select,
    button {
        width:100%;
        box-sizing:border-box;
        margin:6px 0;
    }

    h1 {
        font-size:24px;
    }

    h2 {
        font-size:18px;
    }

    .landing-screen {
        min-height:auto;
        padding:14px;
    }

    .landing-topbar {
        flex-direction:column;
    }

    .top-actions {
        justify-content:flex-start;
    }

    .top-actions button {
        width: 100%;
        font-size: 16px;
        padding: 14px;
    }

    .landing-center {
        min-height:auto;
        padding:28px 0;
    }

    .landing-panel {
        padding:26px 20px;
        width:100%;
        border-radius:28px;
    }

    .landing-panel h1 {
        font-size:42px;
        line-height:1.15;
    }

    .side-card {
        position:static;
        width:auto;
        margin:12px 0;
    }

    .bottom-features {
        position:static;
        grid-template-columns:1fr;
        margin-top:12px;
    }

    .feature-item {
        border-right:none;
        border-bottom:1px solid rgba(95,177,255,0.16);
    }

    .feature-item:last-child {
        border-bottom:none;
    }

    .emergency-alert h1 {
        font-size:34px;
    }

    .emergency-alert p {
        font-size:20px;
    }
}

/* ---------- 2) Yeni bileşenler ---------- */
/* ---------- Ana butonlar ---------- */
.landing-actions.cta-group { margin-top: 26px; gap: 14px; }
.landing-actions .cta-primary,
.landing-actions .cta-city {
    min-width: 250px; padding: 16px 28px; border-radius: 14px; font-size: 19px; font-weight: 800;
    cursor: pointer; transition: transform .15s ease, box-shadow .2s ease;
}
.landing-actions .cta-primary {
    border: 0; color: #fff; background: linear-gradient(135deg, #2f89ff, #00c2ff);
    box-shadow: 0 12px 30px -8px rgba(0, 194, 255, .65);
}
.landing-actions .cta-primary:hover { box-shadow: 0 16px 38px -8px rgba(0, 194, 255, .85); transform: translateY(-1px); }
.landing-actions .cta-city {
    color: #eaf4ff; background: rgba(14, 165, 168, .16); border: 1px solid rgba(14, 165, 168, .6); box-shadow: none;
}
.landing-actions .cta-city:hover { background: rgba(14, 165, 168, .28); }
.landing-actions .cta-primary:active, .landing-actions .cta-city:active { transform: scale(.98); }
.cta-hint { margin: 10px auto 0; font-size: 14px; color: #a8c5df; }
.link-btn {
    display: block; margin: 14px auto 0; padding: 8px 14px; background: none !important; border: 0 !important;
    box-shadow: none !important; color: #8bd5ff; font-size: 14px; text-decoration: underline; cursor: pointer;
}

/* ---------- Hesap paneli ---------- */
.hesap-arka { position: fixed; inset: 0; z-index: 9998; background: rgba(2, 8, 20, .62); backdrop-filter: blur(3px); }
.hesap-paneli {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 9999; width: min(440px, 100%); overflow-y: auto;
    padding: 22px 20px 28px; text-align: left; color: #eaf4ff;
    background: linear-gradient(180deg, #0b1e35, #06111f); border-left: 1px solid rgba(95, 177, 255, .25);
    box-shadow: -20px 0 60px rgba(0, 0, 0, .5);
}
.hesap-arka[hidden], .hesap-paneli[hidden] { display: none; }
.hesap-baslik { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.hesap-baslik h2 { margin: 0; font-size: 22px; }
.hesap-paneli .kapat {
    width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 18px; cursor: pointer;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(95, 177, 255, .25); color: #eaf4ff; box-shadow: none;
}
.hesap-ayar {
    display: block; padding: 14px 16px; margin-bottom: 22px; border-radius: 12px; text-align: center;
    font-weight: 700; text-decoration: none; color: #eaf4ff;
    background: rgba(95, 177, 255, .10); border: 1px solid rgba(95, 177, 255, .3);
}
.hesap-ayar:hover { background: rgba(95, 177, 255, .2); }
.hesap-paneli h3 { margin: 0 0 6px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.hesap-paneli .sayac { font-size: 13px; color: #a8c5df; font-weight: 600; }
.hesap-paneli .ipucu { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: #a8c5df; }

.sehir-kutulari { display: grid; gap: 12px; }
.sehir-kutu { padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(95, 177, 255, .25); }
.sehir-kutu.bos { display: flex; flex-direction: column; align-items: stretch; gap: 10px; border-style: dashed; }
.sehir-kutu.bos > input, .sehir-kutu.bos > button { margin: 0 !important; width: 100% !important; max-width: none !important; box-sizing: border-box; }
.sehir-kutu.dolu.ana { border-color: rgba(61, 220, 132, .55); background: rgba(61, 220, 132, .07); }
.sehir-kutu input[type=text] {
    width: 100%; min-height: 46px; padding: 0 14px; border-radius: 10px; font-size: 15px; color: #eaf4ff;
    background: #0b1b30; border: 1px solid rgba(95, 177, 255, .3); box-sizing: border-box;
}
.sehir-kutu input[type=text]:focus { outline: none; border-color: #00c2ff; box-shadow: 0 0 0 3px rgba(0, 194, 255, .2); }
.sehir-kutu.bos button[type=submit] {
    min-height: 44px; border: 0; border-radius: 10px; font-weight: 700; font-size: 15px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #0ea5a8, #087f8c);
}
.sehir-ad { font-size: 17px; font-weight: 800; }
.sehir-islem { display: flex; gap: 8px; margin-top: 10px; }
.sehir-islem form { margin: 0; }
.mini {
    padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: none;
    color: #8bd5ff; background: rgba(95, 177, 255, .10); border: 1px solid rgba(95, 177, 255, .3);
}
.mini.sil { color: #ff8b8b; background: rgba(255, 59, 59, .10); border-color: rgba(255, 59, 59, .35); }

.kutu-ekle {
    width: 100%; margin-top: 16px; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
    color: #eaf4ff; background: transparent; border: 2px dashed rgba(95, 177, 255, .45); box-shadow: none;
}
.kutu-ekle:hover:not(:disabled) { background: rgba(95, 177, 255, .10); }
.kutu-ekle:disabled { opacity: .5; cursor: not-allowed; }
.kutu-ekle small { color: #a8c5df; font-weight: 500; }

.hesap-paneli button:focus-visible, .hesap-paneli a:focus-visible, .landing-actions button:focus-visible, .link-btn:focus-visible {
    outline: 3px solid #fff; outline-offset: 2px;
}
@media (max-width: 560px) {
    .landing-actions .cta-primary, .landing-actions .cta-city { width: 100%; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .landing-actions button { transition: none; } }
